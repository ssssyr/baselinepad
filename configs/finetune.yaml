# Configuration for MetaWorld 4-DOF action space with action prediction enabled
# Complete standalone configuration file

# ======================================================
#               General Training Settings
# ======================================================
training:
  # Paths
  feature_path: null
  video_path: null
  results_dir: "results_metaworld_4d"

  # Model
  model: "DiT-XL/2"
  image_size: 256
  num_classes: 1000
  predict_horizon: 3
  skip_step: 4

  # Training Loop
  epochs: 500
  global_batch_size: 64
  global_seed: 42
  num_workers: 16
  without_ema: false

  # Optimizer Settings
  learning_rate: 1e-4
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999

  # Learning Rate Scheduler Settings
  use_lr_scheduler: true
  scheduler_type: "cosine"
  warmup_steps: 8000
  min_lr_ratio: 0.01

  # Logging and Checkpointing
  log_every: 100
  eval_every: 50000
  ckpt_every: 10000
  ckpt_wrapper: false
  save_model_only: true

  # Resuming Training
  resume: null
  auto_resume: true

# ======================================================
#                 Component Settings
# ======================================================
components:
  # VAE
  vae: "ema"
  vae_path: null

  # Initialization
  dit_init: null
  rgb_init: null

  # Attention
  attn_mask: true

  # Dynamics - Enable for MetaWorld
  dynamics: true

  # Text Conditioning - Enable for MetaWorld task instructions
  text_cond: true
  clip_path: null
  text_emb_size: 512

  # Depth Conditioning - Disable for MetaWorld
  use_depth: false
  d_hidden_size: 32
  d_patch_size: 8
  depth_filter: false

  # Action Conditioning - DISABLED to enable proper temporal prediction
  action_steps: 3
  action_dim: 4
  action_scale: 1
  absolute_action: true
  action_condition: true
  learnable_action_pos: false

  # Force Conditioning
  use_force: false
  force_dim: 6
  force_stats_path: null

  # AdaLN - per-modality expert LayerNorms (CogVideoX style)
  adamn: true

  # Loss Configuration
  action_loss_lambda: 2.0
  action_loss_start: 0

# ======================================================
#                  MoE Settings
# ======================================================
moe:
  use_moe: true
  num_experts: 4
  moe_top_k: 1
  aux_loss_weight: 0.01
  router_z_loss_weight: 0.001
  moe_start_layer: 14
  moe_shared_experts: 4

# ======================================================
#                  WandB Logging
# ======================================================
wandb:
  use_wandb: true
  wandb_project: "metaworld-action-prediction"
  wandb_run_name: "metaworld_4d_action_pred"

# ======================================================
#               MetaWorld Environment Settings
# ======================================================
metaworld:
  task_names: ["button-press-v2"]
  data_path: ""
  image_size: 256
  use_depth: false
  camera_name: "corner3"
